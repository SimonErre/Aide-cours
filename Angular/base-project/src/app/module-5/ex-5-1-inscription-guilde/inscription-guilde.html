<form (submit)="soumettre($event)">
  <label>
    Pseudo :
    <input [formField]="formulaire.pseudo" />
  </label>
  @if (formulaire.pseudo().touched() && formulaire.pseudo().invalid()) {
    @for (erreur of formulaire.pseudo().errors(); track erreur.kind) {
      <p class="erreur">⚠ {{ erreur.message }}</p>
    }
  }

  <!-- TODO : champ email + erreurs -->

  <!-- TODO : liste déroulante classe (@for sur classes) + erreurs -->

  <!-- TODO : bouton désactivé tant que le formulaire est invalide -->
  <button type="submit">Rejoindre la guilde</button>
</form>
